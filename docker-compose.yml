services:
  # ==========================================================
  # 1. Web Application Container (Laravel Octane + FrankenPHP)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8093}:8000"
    environment:
      - TZ=${APP_TIMEZONE:-Asia/Jakarta}
      - APP_NAME=${APP_NAME:-SIGAP}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-sigap_user}
      - DB_PASSWORD=${DB_PASSWORD:-sigap_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigap-network

  # ==========================================================
  # 2. Scheduler Container (Cron Jobs / Periodic Tasks)
  # ==========================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-Asia/Jakarta}
      - APP_NAME=${APP_NAME:-SIGAP}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-sigap_user}
      - DB_PASSWORD=${DB_PASSWORD:-sigap_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigap-network
    command: php artisan schedule:work

  # ==========================================================
  # 3. Queue Worker Container (Background Async Jobs)
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-Asia/Jakarta}
      - APP_NAME=${APP_NAME:-SIGAP}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-sigap_user}
      - DB_PASSWORD=${DB_PASSWORD:-sigap_secret_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigap-network
    command: php artisan queue:work --tries=3 --sleep=3

  # ==========================================================
  # 4. Database MySQL Container
  # ==========================================================
  db:
    image: mysql:8.0
    container_name: sigap-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3314}:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sigap_root_2026}
      MYSQL_DATABASE: ${DB_DATABASE:-db_sigap}
      MYSQL_USER: ${DB_USERNAME:-sigap_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sigap_secret_2026}
    volumes:
      - sigap-db-data:/var/lib/mysql
    networks:
      - sigap-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-sigap_root_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================================
  # 5. Redis Container (Cache, Session, & Queue Broker)
  # ==========================================================
  redis:
    image: redis:alpine
    container_name: sigap-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6389}:6379"
    volumes:
      - sigap-redis-data:/data
    networks:
      - sigap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  sigap-network:
    driver: bridge

volumes:
  sigap-db-data:
  sigap-redis-data:
