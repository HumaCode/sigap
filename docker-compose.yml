services:
  # ==========================================================
  # 1. Web Application Container (Laravel Octane FrankenPHP)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-app
    ports:
      - "8000:8000"
      - "5173:5173" # Port Vite untuk HMR di mode dev
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHOKIDAR_USEPOLLING=true # Mendukung Vite HMR di Docker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sigap-network
    restart: unless-stopped
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--watch"]

  # ==========================================================
  # 2. Scheduler Container (Cron & Auto-Prune Engine)
  # ==========================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-scheduler
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      - app
      - db
      - redis
    networks:
      - sigap-network
    restart: unless-stopped
    # Menjalankan scheduler Laravel terus menerus (setiap menit)
    # Menjalankan monitor:check-uptime dan logs:prune (Daily Auto-Prune)
    command: ["php", "artisan", "schedule:work"]

  # ==========================================================
  # 3. Queue Worker Container (Background Jobs / Asinkron)
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-queue
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_sigap}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      - app
      - db
      - redis
    networks:
      - sigap-network
    restart: unless-stopped
    # Menjalankan antrean pekerjaan async seperti notifikasi, crawler, dll
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]

  # ==========================================================
  # 4. Database MySQL Container
  # ==========================================================
  db:
    image: mysql:8.0
    container_name: sigap-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-db_sigap}
    volumes:
      - sigap-mysql-data:/var/lib/mysql
    networks:
      - sigap-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # 5. Redis Container (Cache, Session, & Queue Broker)
  # ==========================================================
  redis:
    image: redis:alpine
    container_name: sigap-redis
    ports:
      - "6379:6379"
    volumes:
      - sigap-redis-data:/data
    networks:
      - sigap-network
    restart: unless-stopped

networks:
  sigap-network:
    driver: bridge

volumes:
  sigap-mysql-data:
  sigap-redis-data:
