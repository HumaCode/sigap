services:
  # ==========================================================
  # 1. Web Application Container (Laravel Octane FrankenPHP)
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-app
    ports:
      - "${APP_PORT:-8093}:8000"
      - "${VITE_PORT:-5182}:5173" # Port Vite untuk HMR di mode dev
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sijaga}
      - DB_USERNAME=${DB_USERNAME:-sijaga}
      - DB_PASSWORD=${DB_PASSWORD:-sijaga2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHOKIDAR_USEPOLLING=true # Mendukung Vite HMR di Docker
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sigap-network
    restart: unless-stopped
    command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--watch"]

  # ==========================================================
  # 2. Scheduler Container (Cron & Auto-Prune Engine)
  # ==========================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-scheduler
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sijaga}
      - DB_USERNAME=${DB_USERNAME:-sijaga}
      - DB_PASSWORD=${DB_PASSWORD:-sijaga2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      - app
      - db
      - redis
    networks:
      - sigap-network
    restart: unless-stopped
    healthcheck:
      disable: true
    # Menjalankan scheduler Laravel terus menerus (setiap menit)
    # Menjalankan monitor:check-uptime dan logs:prune (Daily Auto-Prune)
    command: ["php", "artisan", "schedule:work"]

  # ==========================================================
  # 3. Queue Worker Container (Background Jobs / Asinkron)
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigap-app:latest
    container_name: sigap-queue
    environment:
      - APP_NAME=${APP_NAME:-SIGAP Web}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8093}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sijaga}
      - DB_USERNAME=${DB_USERNAME:-sijaga}
      - DB_PASSWORD=${DB_PASSWORD:-sijaga2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    depends_on:
      - app
      - db
      - redis
    networks:
      - sigap-network
    restart: unless-stopped
    healthcheck:
      disable: true
    # Menjalankan antrean pekerjaan async seperti notifikasi, crawler, dll
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]

  # ==========================================================
  # 4. Database MySQL Container
  # ==========================================================
  db:
    image: mysql:8.0
    container_name: sigap-db
    ports:
      - "${FORWARD_DB_PORT:-${DB_PORT:-3314}}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-sijaga}
      MYSQL_USER: ${DB_USERNAME:-sijaga}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sijaga2026}
    volumes:
      - sijaga-mysql-data:/var/lib/mysql
    networks:
      - sigap-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-sijaga}", "-p${DB_PASSWORD:-sijaga2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # 5. Redis Container (Cache, Session, & Queue Broker)
  # ==========================================================
  redis:
    image: redis:alpine
    container_name: sigap-redis
    ports:
      - "${FORWARD_REDIS_PORT:-${REDIS_PORT:-6379}}:6379"
    volumes:
      - sijaga-redis-data:/data
    networks:
      - sigap-network
    restart: unless-stopped

networks:
  sigap-network:
    driver: bridge

volumes:
  sijaga-mysql-data:
  sijaga-redis-data:
